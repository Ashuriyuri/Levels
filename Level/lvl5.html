<!DOCTYPE html>
<html>
<head>
    <title>Level 5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow text-center" style="width: 420px; border-radius: 15px;">

    <span class="badge bg-primary mb-2">Level 5</span>
    <h3>Counter: Coins</h3>
    <p>Use + and - buttons. Coins cannot go below 0.</p>

    <h4>Coins: <span id="coins">0</span></h4>

    <div class="d-flex justify-content-between my-3">
        <button class="btn btn-outline-dark" onclick="subtract()">-1</button>
        <button class="btn btn-outline-dark" onclick="add()">+1</button>
    </div>

    <div class="d-flex gap-2">
        <a href="lvl4.html" class="btn btn-secondary w-50">← Back</a>
        <a href="lvl6.html" class="btn btn-dark w-50">Next Level →</a>
    </div>

</div>




<script>
let coins = 0;

function add() {
    coins++;
    document.getElementById("coins").innerText = coins;
}



function subtract() {
    if (coins > 0) {
        coins--;
        document.getElementById("coins").innerText = coins;
    }
}




</script>

</body>
</html>
