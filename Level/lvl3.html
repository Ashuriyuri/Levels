<!DOCTYPE html>
<html>
<head>
    <title>Level 3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow" style="width: 420px; border-radius: 15px;">

    <span class="badge bg-primary mb-2">Level <span id="levelNumber">1</span></span>
    <h3>JavaScript: Level Up</h3>
    <p>Click the button to increase the level number.</p>

    <button class="btn btn-success w-100 mb-3" onclick="levelUp()">Level Up</button>

    <div class="d-flex gap-2">
        <a href="lvl2.html" class="btn btn-secondary w-50">← Back</a>
        <a href="lvl4.html" class="btn btn-dark w-50">Next Level →</a>
    </div>

</div>





<script>
let level = 1;

function levelUp() {
    if (level < 6) {
        level++;
        document.getElementById("levelNumber").innerText = level;
    }
}


</script>

</body>
</html>
