<!DOCTYPE html>
<html>
<head>
    <title>Level 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex justify-content-center align-items-center vh-100">

<div class="card p-4 shadow text-center" style="width: 420px; border-radius: 15px;">

    <span class="badge bg-primary mb-2">Level 6</span>
    <h3>Conditionals: Pick the Correct Door</h3>
    <p>Click a door. Only one is correct.</p>

    <div class="d-flex justify-content-between my-3">
        <button class="btn btn-success w-30" onclick="check(1)">Door 1</button>
        <button class="btn btn-warning w-30" onclick="check(2)">Door 2</button>
        <button class="btn btn-danger w-30" onclick="check(3)">Door 3</button>
    </div>

    <p id="result"></p>

    <div class="d-flex gap-2 mt-3">
        <a href="lvl5.html" class="btn btn-secondary w-50">← Back</a>
        <a href="lvl1.html" class="btn btn-dark w-50">Restart</a>
    </div>

</div>

<script>
let correctDoor = 2;

function check(choice) {
    if (choice === correctDoor) {
        document.getElementById("result").innerHTML = "<span class='text-success'>You Win!</span>";
    } else {
        document.getElementById("result").innerHTML = "<span class='text-danger'>Wrong Door!</span>";
    }
}
</script>

</body>
</html>
